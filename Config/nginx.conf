
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backends {
        server 10.7.8.224:3001 max_fails=1 fail_timeout=5s;
        server 10.7.15.7:3002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name app.dotenv.test;

        location / {
            proxy_pass http://backends;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name app.dotenv.test;

        ssl_certificate     /Users/satvik/Documents/Projects/app.dotenv.test.pem;
        ssl_certificate_key /Users/satvik/Documents/Projects/app.dotenv.test-key.pem;

        location / {
            proxy_pass http://backends;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

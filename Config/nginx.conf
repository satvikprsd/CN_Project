worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backends {
        server 10.7.22.85:3001;
        server 10.7.30.220:3002;
    }
    
    server {
        listen 443 ssl;
        server_name app.dotenv.test;

        ssl_certificate     /Users/satvik/Documents/Projects/app.dotenv.test.pem;
        ssl_certificate_key /Users/satvik/Documents/Projects/app.dotenv.test-key.pem;

        location / {
            proxy_pass http://backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}